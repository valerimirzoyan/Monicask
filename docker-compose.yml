services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: workplace
      POSTGRES_PASSWORD: workplace
      POSTGRES_DB: workplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workplace -d workplace"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://workplace:workplace@db:5432/workplace
      ENVIRONMENT: prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
